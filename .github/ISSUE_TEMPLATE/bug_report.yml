name: Bug report
description: Report a crash, an error, or a skill/mechanic that does not work as expected
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        [中文界面 / Chinese](https://github.com/Tangwenjun910/star-dragon-issues/issues/new?template=bug_report-zh.yml) - use this form if you prefer Chinese.

        Thanks for reporting. Please fill in as much as you can - the more complete the report, the faster it can be fixed.

        **If the game crashed, your latest log and crash report are required.** Without a log I usually cannot investigate.

  - type: checkboxes
    id: precheck
    attributes:
      label: Before submitting
      description: Please confirm the following first - it saves a lot of back and forth.
      options:
        - label: I have searched the existing issues and this has not been reported yet
          required: true
        - label: I am using the newest Star Dragon file from the CurseForge Files tab
          required: true
        - label: I have Dragon Survival and GeckoLib installed - both are required, and the CurseForge page lists the compatible versions
          required: true
        - label: I have read the [README](https://github.com/Tangwenjun910/star-dragon-issues#readme) and will provide the information requested below
          required: true

  - type: input
    id: star_dragon_version
    attributes:
      label: Star Dragon version
      description: The version you are running. Newest files are always published on the CurseForge page - please check there for updates.
      placeholder: "the version you installed"
    validations:
      required: true

  - type: input
    id: mc_version
    attributes:
      label: Minecraft version
      placeholder: "1.21.1"
    validations:
      required: true

  - type: input
    id: neoforge_version
    attributes:
      label: NeoForge version
      placeholder: "21.1"
    validations:
      required: true

  - type: input
    id: ds_version
    attributes:
      label: Dragon Survival version (required dependency)
      description: The version you have installed. This is a required dependency.
      placeholder: "the version you installed"
    validations:
      required: true

  - type: dropdown
    id: singleplayer
    attributes:
      label: Singleplayer or multiplayer?
      options:
        - Singleplayer
        - LAN multiplayer
        - Dedicated server (multiplayer)
        - Happens in both singleplayer and multiplayer
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What happened, and how does it differ from what you expected?
      placeholder: "Example: after using the Starlight Impact skill, the dragon model freezes in place for about 3 seconds."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Be specific enough that someone can follow along and see the same thing
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "Example: after casting the skill the dragon should be able to move immediately."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / crash report
      description: |
        Paste your log here, or upload the file by dragging it into this box.
        - Crash: the newest file in `crash-reports/`
        - Non-crash issue: `.minecraft/logs/latest.log` (uploading to https://mclo.gs and pasting the link is preferred)
        **Issues that just say "it crashed" without a log will be asked for one before they are looked at.**
      render: text
      placeholder: Paste the log content, or a mclo.gs / pastebin link
    validations:
      required: true

  - type: input
    id: modlist
    attributes:
      label: Mod list
      description: How many mods in total do you have installed? If you use a modpack, name it and give its version.
      placeholder: "Example: 87 mods total, modpack XXX v1.2"
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Did you change any configuration?
      description: If you edited the `config` settings, describe what you changed (for example skill damage, or turning a mechanic off).
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else? (optional)
      description: |
        Any other useful clues, for example:
        - Screenshots / video
        - Does the problem still happen with only Dragon Survival + Star Dragon installed?
        - Which versions have you tried? Which version did the problem start in?
    validations:
      required: false