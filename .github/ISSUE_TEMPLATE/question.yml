name: Question / Suggestion
description: Gameplay questions, balance feedback, feature requests - use this if you are not sure it is a bug
title: "[Question] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        [中文界面 / Chinese](https://github.com/Tangwenjun910/star-dragon-issues/issues/new?template=question-zh.yml) - use this form if you prefer Chinese.

        Use this form for **questions, suggestions and balance feedback**.

        If you want to report a crash or something not working, please use the [Bug report](https://github.com/Tangwenjun910/star-dragon-issues/issues/new?template=bug_report.yml) form instead.

  - type: checkboxes
    id: precheck
    attributes:
      label: Before submitting
      options:
        - label: I have searched the existing issues and this has not been asked or suggested yet
          required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of feedback is this?
      options:
        - Gameplay question (how a mechanic works)
        - Version / compatibility question
        - Balance suggestion (something feels too strong or too weak)
        - New feature / content suggestion
        - Documentation or description is unclear
        - Something else
    validations:
      required: true

  - type: input
    id: star_dragon_version
    attributes:
      label: Star Dragon version
      description: The version you are running. Newest files are always published on the CurseForge page.
      placeholder: "the version you installed"
    validations:
      required: false

  - type: textarea
    id: content
    attributes:
      label: Details
      description: |
        - Question: also mention what you have already tried
        - Suggestion: explain **why** the change would be better, ideally with concrete numbers or a scenario
      placeholder: |
        Example: is the starlight regeneration rate in rain too slow?
        I tried idling in the rain for 10 minutes and it still was not full, while in clear weather it only takes 2 minutes...
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots / video / logs (optional)
      description: Images make things much clearer, just drag them in
    validations:
      required: false